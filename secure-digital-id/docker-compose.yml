services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: secure_id
      POSTGRES_USER: secure_id
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-development-only}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U secure_id -d secure_id"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/secure_id
      SPRING_DATASOURCE_USERNAME: secure_id
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-local-development-only}
      APP_JWT_SECRET: ${APP_JWT_SECRET:?Set APP_JWT_SECRET in your environment}
      APP_TOKEN_TTL_MINUTES: ${APP_TOKEN_TTL_MINUTES:-30}
      APP_CORS_ALLOWED_ORIGINS: http://localhost:5173
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    environment:
      VITE_API_BASE_URL: http://localhost:8080
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  postgres_data:
