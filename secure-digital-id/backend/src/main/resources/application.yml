server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: never
spring:
  application:
    name: secure-digital-id
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/secure_id}
    username: ${SPRING_DATASOURCE_USERNAME:secure_id}
    password: ${SPRING_DATASOURCE_PASSWORD:change-me}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        format_sql: false
management:
  endpoints:
    web:
      exposure:
        include: health,info
app:
  jwt:
    secret: ${APP_JWT_SECRET:}
    ttl-minutes: ${APP_TOKEN_TTL_MINUTES:30}
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173}
